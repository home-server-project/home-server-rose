---
name: stable

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  HOME_SERVER_BASE_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable
  HOME_SERVER_BASE_V2_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable-v2
  UPSIDE_PACKAGE_IMAGE: ghcr.io/home-server-project/cockpit-upside:stable
  BREW_IMAGE: ghcr.io/ublue-os/brew:latest
  VIRTUI_MANAGER_PACKAGE_IMAGE: ghcr.io/home-server-project/virtui-manager:stable
  MERGERFS_PACKAGE_IMAGE: ghcr.io/home-server-project/mergerfs:stable-v2

jobs:
  resolve_external:
    name: Resolve external inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      mergerfs_tag: ${{ steps.external.outputs.mergerfs_tag }}
      mergerfs_url: ${{ steps.external.outputs.mergerfs_url }}
      mergerfs_sha256: ${{ steps.external.outputs.mergerfs_sha256 }}
      base_ref: ${{ steps.base.outputs.base_ref }}
      base_v2_ref: ${{ steps.base.outputs.base_v2_ref }}
      upside_ref: ${{ steps.packages.outputs.upside_ref }}
      brew_ref: ${{ steps.packages.outputs.brew_ref }}
      virtui_ref: ${{ steps.packages.outputs.virtui_ref }}
      mergerfs_ref: ${{ steps.packages.outputs.mergerfs_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          echo "build_date=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "Source revision: ${source_sha}"

      - name: Resolve mergerfs release
        id: external
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./build_files/resolve-external-software.sh /tmp/external.env
          cat /tmp/external.env >> "${GITHUB_OUTPUT}"

      - name: Install image resolver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Resolve and verify Home Server Base
        id: base
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local variant="${2:-}"
            local digest
            local -a inspect_args=(--override-arch amd64)

            if [[ -n "${variant}" ]]; then
              inspect_args+=(--override-variant "${variant}")
            fi

            digest="$(skopeo inspect \
              "${inspect_args[@]}" \
              --format '{{.Digest}}' \
              "docker://${image}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "${image%:*}" "${digest}"
          }

          base_ref="$(resolve_ref "${HOME_SERVER_BASE_IMAGE}")"
          base_v2_ref="$(resolve_ref "${HOME_SERVER_BASE_V2_IMAGE}" v2)"

          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${base_ref}" >/dev/null
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${base_v2_ref}" >/dev/null

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "base_v2_ref=${base_v2_ref}" >> "${GITHUB_OUTPUT}"
          echo "Verified Home Server Base normal: ${base_ref}"
          echo "Verified Home Server Base v2: ${base_v2_ref}"

      - name: Resolve package and Brew inputs
        id: packages
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local digest
            digest="$(skopeo inspect \
              --override-arch amd64 \
              --format '{{.Digest}}' \
              "docker://${image}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "${image%:*}" "${digest}"
          }

          echo "upside_ref=$(resolve_ref "${UPSIDE_PACKAGE_IMAGE}")" >> "${GITHUB_OUTPUT}"

          brew_ref="$(resolve_ref "${BREW_IMAGE}")"
          cosign verify \
            --new-bundle-format=false \
            --key ublue-brew-cosign.pub \
            "${brew_ref}" >/dev/null
          echo "brew_ref=${brew_ref}" >> "${GITHUB_OUTPUT}"

          echo "virtui_ref=$(resolve_ref "${VIRTUI_MANAGER_PACKAGE_IMAGE}")" >> "${GITHUB_OUTPUT}"
          echo "mergerfs_ref=$(resolve_ref "${MERGERFS_PACKAGE_IMAGE}")" >> "${GITHUB_OUTPUT}"

      - name: Resolution summary
        shell: bash
        run: |
          {
            echo '## Stable external software snapshot'
            echo
            echo "- Source ref: ${{ github.ref }}"
            echo "- Source revision: ${{ steps.metadata.outputs.source_sha }}"
            echo "- Build date: ${{ steps.metadata.outputs.build_date }}"
            echo "- Home Server Base normal: ${{ steps.base.outputs.base_ref }}"
            echo "- Home Server Base v2: ${{ steps.base.outputs.base_v2_ref }}"
            echo "- mergerfs normal: ${{ steps.external.outputs.mergerfs_tag }}"
            echo "- mergerfs v2 package: ${{ steps.packages.outputs.mergerfs_ref }}"
            echo "- UPSide: ${{ steps.packages.outputs.upside_ref }}"
            echo "- uBlue Brew: ${{ steps.packages.outputs.brew_ref }}"
            echo "- VirtUI Manager (HCI only): ${{ steps.packages.outputs.virtui_ref }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ matrix.image_name }} (${{ matrix.arch_name }})
    needs: resolve_external
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: home-server-rose
            target: home-server-rose
            validation_mode: base
            arch_name: x86_64
            platform: linux/amd64
            rpm_arch: x86_64
            microarch: v3
            current_tag: 10
            immutable_prefix: 10
            mergerfs_source: upstream
          - image_name: home-server-rose-hci
            target: home-server-rose-hci
            validation_mode: hci
            arch_name: x86_64
            platform: linux/amd64
            rpm_arch: x86_64
            microarch: v3
            current_tag: 10
            immutable_prefix: 10
            mergerfs_source: upstream
          - image_name: home-server-rose
            target: home-server-rose
            validation_mode: base
            arch_name: x86_64_v2
            platform: linux/amd64/v2
            rpm_arch: x86_64_v2
            microarch: v2
            current_tag: 10-v2
            immutable_prefix: 10-v2
            mergerfs_source: package-v2
          - image_name: home-server-rose-hci
            target: home-server-rose-hci
            validation_mode: hci
            arch_name: x86_64_v2
            platform: linux/amd64/v2
            rpm_arch: x86_64_v2
            microarch: v2
            current_tag: 10-v2
            immutable_prefix: 10-v2
            mergerfs_source: package-v2

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve_external.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "ERROR: source revision changed during workflow: expected ${EXPECTED_SHA}, got ${actual_sha}" >&2
            exit 1
          fi

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Pre-pull resolved build inputs
        shell: bash
        env:
          BASE_REF: ${{ matrix.arch_name == 'x86_64_v2' && needs.resolve_external.outputs.base_v2_ref || needs.resolve_external.outputs.base_ref }}
          UPSIDE_REF: ${{ needs.resolve_external.outputs.upside_ref }}
          BREW_REF: ${{ needs.resolve_external.outputs.brew_ref }}
          VIRTUI_MANAGER_REF: ${{ needs.resolve_external.outputs.virtui_ref }}
          MERGERFS_REF: ${{ needs.resolve_external.outputs.mergerfs_ref }}
        run: |
          set -euo pipefail

          pull_with_retry() {
            local image="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "Pull ${attempt}/3: ${image}"
              if sudo podman pull "${image}"; then
                return 0
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                sleep $((attempt * 10))
              fi
            done
            echo "ERROR: failed to pull ${image} after 3 attempts." >&2
            return 1
          }

          pull_with_retry "${BASE_REF}"
          pull_with_retry "${UPSIDE_REF}"
          pull_with_retry "${BREW_REF}"
          pull_with_retry "${MERGERFS_REF}"
          if [[ "${{ matrix.validation_mode }}" == 'hci' ]]; then
            pull_with_retry "${VIRTUI_MANAGER_REF}"
          fi

      - name: Prepare image names and deterministic release tag
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve_external.outputs.source_sha }}
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY,,}"
          image_name="${{ matrix.image_name }}"
          short_sha="${SOURCE_SHA:0:7}"
          build_date="${{ needs.resolve_external.outputs.build_date }}"
          build_tag="${{ matrix.immutable_prefix }}-${build_date}-${short_sha}"

          echo "CURRENT_TAG=${{ matrix.current_tag }}" >> "${GITHUB_ENV}"
          echo "IMAGE_REGISTRY=${registry}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${image_name}" >> "${GITHUB_ENV}"
          echo "IMAGE_REPOSITORY=${registry}/${image_name}" >> "${GITHUB_ENV}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"

      - name: Build image
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve_external.outputs.source_sha }}
          BASE_REF: ${{ matrix.arch_name == 'x86_64_v2' && needs.resolve_external.outputs.base_v2_ref || needs.resolve_external.outputs.base_ref }}
          UPSIDE_REF: ${{ needs.resolve_external.outputs.upside_ref }}
          BREW_REF: ${{ needs.resolve_external.outputs.brew_ref }}
          VIRTUI_MANAGER_REF: ${{ needs.resolve_external.outputs.virtui_ref }}
          MERGERFS_REF: ${{ needs.resolve_external.outputs.mergerfs_ref }}
        run: |
          set -euo pipefail

          package_args=(
            --build-arg "UPSIDE_PACKAGE_IMAGE=${UPSIDE_REF}"
            --build-arg "BREW_IMAGE=${BREW_REF}"
            --build-arg "MERGERFS_PACKAGE_IMAGE=${MERGERFS_REF}"
          )
          if [[ "${{ matrix.validation_mode }}" == 'hci' ]]; then
            package_args+=(--build-arg "VIRTUI_MANAGER_PACKAGE_IMAGE=${VIRTUI_MANAGER_REF}")
          fi

          sudo podman build \
            --platform "${{ matrix.platform }}" \
            --pull=never \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --target "${{ matrix.target }}" \
            --build-arg "HOME_SERVER_BASE_IMAGE=${BASE_REF}" \
            "${package_args[@]}" \
            --build-arg "MERGERFS_SOURCE=${{ matrix.mergerfs_source }}" \
            --build-arg "MERGERFS_URL=${{ needs.resolve_external.outputs.mergerfs_url }}" \
            --build-arg "MERGERFS_SHA256=${{ needs.resolve_external.outputs.mergerfs_sha256 }}" \
            --build-arg "HOME_SERVER_ROSE_REPOSITORY=${IMAGE_REGISTRY}/home-server-rose" \
            --build-arg "HOME_SERVER_ROSE_HCI_REPOSITORY=${IMAGE_REGISTRY}/home-server-rose-hci" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "io.home-server-project.rose.arch=${{ matrix.arch_name }}" \
            --label "io.home-server-project.rose.microarch=${{ matrix.microarch }}" \
            --tag "${IMAGE_NAME}:unrechunked" \
            --file Containerfile \
            .

      - name: Rechunk image
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail

          rechunk_tmp="${RUNNER_TEMP}/${IMAGE_NAME}-rechunk"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"

          df -h "${RUNNER_TEMP}" /var/lib/containers

          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            "localhost/${IMAGE_NAME}:unrechunked" \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            "localhost/${IMAGE_NAME}:unrechunked" \
            "localhost/${IMAGE_NAME}:test"

          layer_count="$(
            sudo skopeo inspect --raw \
              "containers-storage:localhost/${IMAGE_NAME}:test" \
              | jq -r '.layers | length'
          )"

          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          if (( layer_count > OCI_LAYER_LIMIT )); then
            echo "ERROR: rechunked image has ${layer_count} layers; OCI maximum is ${OCI_LAYER_LIMIT}" >&2
            exit 1
          fi

          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"
          echo "Rechunked image layers: ${layer_count} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"

      - name: Validate completed image architecture
        shell: bash
        env:
          EXPECTED_RPM_ARCH: ${{ matrix.rpm_arch }}
          EXPECTED_IMAGE_ARCH: ${{ matrix.arch_name }}
          EXPECTED_MICROARCH: ${{ matrix.microarch }}
        run: |
          set -euo pipefail

          sudo podman run --rm \
            -e "EXPECTED_RPM_ARCH=${EXPECTED_RPM_ARCH}" \
            --entrypoint /bin/bash \
            "${IMAGE_NAME}:test" \
            -c '
              set -euo pipefail
              glibc_arch="$(rpm -q --qf "%{ARCH}\\n" glibc | head -n1)"
              if [[ "${glibc_arch}" != "${EXPECTED_RPM_ARCH}" ]]; then
                echo "ERROR: glibc RPM architecture is ${glibc_arch}; expected ${EXPECTED_RPM_ARCH}" >&2
                exit 1
              fi
              echo "Validated RPM architecture: ${glibc_arch}"
            '

          arch_label="$(sudo podman image inspect "${IMAGE_NAME}:test" \
            --format '{{ index .Labels "io.home-server-project.rose.arch" }}')"
          microarch_label="$(sudo podman image inspect "${IMAGE_NAME}:test" \
            --format '{{ index .Labels "io.home-server-project.rose.microarch" }}')"

          [[ "${arch_label}" == "${EXPECTED_IMAGE_ARCH}" ]]
          [[ "${microarch_label}" == "${EXPECTED_MICROARCH}" ]]
          echo "Validated image labels: arch=${arch_label}, microarch=${microarch_label}"

      - name: Critical common health
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm --privileged --device /dev/fuse \
            --entrypoint /usr/libexec/home-server-rose/health/critical-common \
            "${IMAGE_NAME}:test"

      - name: Critical HCI health
        if: matrix.validation_mode == 'hci'
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --entrypoint /usr/libexec/home-server-rose/health/critical-hci \
            "${IMAGE_NAME}:test"

      - name: Confirm base image has no HCI host stack
        if: matrix.validation_mode == 'base'
        shell: bash
        run: |
          set -euo pipefail
          if rpm_out="$(sudo podman run --rm --entrypoint rpm "${IMAGE_NAME}:test" -q libvirt-daemon-kvm 2>&1)"; then
            echo 'ERROR: base image unexpectedly contains libvirt-daemon-kvm'
            echo "${rpm_out}"
            exit 1
          fi
          if rpm_out="$(sudo podman run --rm --entrypoint rpm "${IMAGE_NAME}:test" -q virtui-manager 2>&1)"; then
            echo 'ERROR: base image unexpectedly contains virtui-manager'
            echo "${rpm_out}"
            exit 1
          fi
          echo 'PASS  HCI virtualization stack and VirtUI Manager absent from base image'

      - name: Optional feature health
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --entrypoint /usr/libexec/home-server-rose/health/optional \
            "${IMAGE_NAME}:test" | tee /tmp/optional-health.txt
          {
            echo '### Optional feature health'
            echo
            echo '```text'
            cat /tmp/optional-health.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Login to GHCR
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push image tags
        id: push
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail
          sudo podman tag "${IMAGE_NAME}:test" "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman tag "${IMAGE_NAME}:test" "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/published-digest \
            "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/published-digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign image digest
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify published signature
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve_external.outputs.source_sha }}
          BASE_REF: ${{ matrix.arch_name == 'x86_64_v2' && needs.resolve_external.outputs.base_v2_ref || needs.resolve_external.outputs.base_ref }}
          RECHUNK_LAYERS: ${{ steps.rechunk.outputs.layers }}
          DIGEST: ${{ steps.push.outputs.digest }}
          UPSIDE_REF: ${{ needs.resolve_external.outputs.upside_ref }}
          BREW_REF: ${{ needs.resolve_external.outputs.brew_ref }}
          VIRTUI_MANAGER_REF: ${{ needs.resolve_external.outputs.virtui_ref }}
          MERGERFS_REF: ${{ needs.resolve_external.outputs.mergerfs_ref }}
        run: |
          {
            echo "## ${{ matrix.image_name }} (${{ matrix.arch_name }})"
            echo
            echo "- Source ref: ${{ github.ref }}"
            echo "- Source revision: ${SOURCE_SHA}"
            echo "- Target: ${{ matrix.target }}"
            echo "- Build platform: ${{ matrix.platform }}"
            echo "- RPM architecture: ${{ matrix.rpm_arch }}"
            echo "- CPU microarchitecture baseline: ${{ matrix.microarch }}"
            echo "- Home Server Base: ${BASE_REF:-unknown}"
            echo "- UPSide package: ${UPSIDE_REF:-unknown}"
            echo "- uBlue Brew image: ${BREW_REF:-unknown}"
            if [[ "${{ matrix.mergerfs_source }}" == 'package-v2' ]]; then
              echo "- mergerfs: ${MERGERFS_REF:-unknown}"
            else
              echo "- mergerfs: upstream ${{ needs.resolve_external.outputs.mergerfs_tag }}"
            fi
            if [[ "${{ matrix.validation_mode }}" == 'hci' ]]; then
              echo "- VirtUI Manager package: ${VIRTUI_MANAGER_REF:-unknown}"
            fi
            echo "- Rechunked layers: ${RECHUNK_LAYERS:-unknown} / OCI max ${OCI_LAYER_LIMIT} (RPM chunk target ${RECHUNK_MAX_LAYERS})"
            echo "- Moving tag: ${IMAGE_REPOSITORY:-not-published}:${CURRENT_TAG}"
            echo "- Immutable tag: ${IMAGE_REPOSITORY:-not-published}:${BUILD_TAG:-n/a}"
            echo "- Digest: ${DIGEST:-not-published}"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Publish GitHub release
    needs: [resolve_external, build]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install release tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish release for matching image set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA:0:7}"
          build_date="${{ needs.resolve_external.outputs.build_date }}"
          release_tag="10-${build_date}-${short_sha}"
          v2_tag="10-v2-${build_date}-${short_sha}"

          rose_image="${registry}/home-server-rose:${release_tag}"
          rose_v2_image="${registry}/home-server-rose:${v2_tag}"
          hci_image="${registry}/home-server-rose-hci:${release_tag}"
          hci_v2_image="${registry}/home-server-rose-hci:${v2_tag}"

          rose_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${rose_image}")"
          rose_v2_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${rose_v2_image}")"
          hci_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${hci_image}")"
          hci_v2_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${hci_v2_image}")"

          [[ "${rose_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${rose_v2_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${hci_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${hci_v2_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_date="${build_date:0:4}-${build_date:4:2}-${build_date:6:2}"
          release_title="Home Server Rose 10 - ${release_date}"

          cat > /tmp/release-notes.md <<EOF_NOTES
          > [!CAUTION]
          > Home Server Rose is still in development. These images are intended for VM testing, not production or a real home server yet.

          ## Home Server Rose 10

          Both product variants at both CPU baselines passed their critical release-health contract. Optional tools may be reported as degraded in the corresponding Actions build summary without blocking an otherwise healthy OS image.

          ### Home Server Rose — x86-64-v3
          Current: `${registry}/home-server-rose:10`
          Immutable: `${rose_image}`
          Digest: `${rose_digest}`

          ### Home Server Rose — x86-64-v2
          Current: `${registry}/home-server-rose:10-v2`
          Immutable: `${rose_v2_image}`
          Digest: `${rose_v2_digest}`

          ### Home Server Rose HCI — x86-64-v3
          Current: `${registry}/home-server-rose-hci:10`
          Immutable: `${hci_image}`
          Digest: `${hci_digest}`

          ### Home Server Rose HCI — x86-64-v2
          Current: `${registry}/home-server-rose-hci:10-v2`
          Immutable: `${hci_v2_image}`
          Digest: `${hci_v2_digest}`

          All four published image digests are signed with the Home Server Project Cosign key.
          EOF_NOTES

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

  cleanup:
    name: cleanup
    needs: release
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Remove expired stable images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: home-server-rose,home-server-rose-hci
          delete-tags: '10-*'
          exclude-tags: '10,10-v2,testing,testing-v2,testing-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

      - name: Remove expired GitHub Releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '45 days ago' +%s)"
          keep_count=7

          mapfile -t releases < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] |
                    select(.draft == false) |
                    select(.tag_name | test("^10-[0-9]{8}-[0-9a-f]{7}$")) |
                    [.published_at, (.id | tostring), .tag_name] |
                    @tsv' \
              | sort -r
          )

          echo "Stable releases found: ${#releases[@]}"
          echo "Keeping at least the newest ${keep_count}; only older releases beyond 45 days may be removed."

          for i in "${!releases[@]}"; do
            IFS=$'\t' read -r published_at release_id tag <<< "${releases[${i}]}"

            if (( i < keep_count )); then
              echo "KEEP newest: ${tag} (${published_at})"
              continue
            fi

            published_epoch="$(date -u -d "${published_at}" +%s)"
            if (( published_epoch >= cutoff_epoch )); then
              echo "KEEP recent: ${tag} (${published_at})"
              continue
            fi

            echo "DELETE expired release: ${tag} (${published_at})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"

            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
          done
